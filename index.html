    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fpacstore.com.br/">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">

    <meta property="twitter:title" content="F PAC STORE | Authentic Streetwear & Identity">
    <meta property="twitter:description" content="Peças premium de alta gramatura e estampas exclusivas. Estúdio de Identidade e Atitude em Joinville/SC.">

    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Custom Loading Animation Styles -->
    <style>
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.4s ease-in-out, visibility 0.4s;
      }
      .loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        animation: fadeIn 0.6s ease-out forwards;
      }
      .loading-logo {
        width: 180px;
        height: auto;
        filter: drop-shadow(0 10px 20px rgba(0,0,0,0.05));
      }
      .loading-loader {
        width: 40px;
        height: 40px;
        border: 2px solid #f3f3f3;
        border-top: 2px solid #f7c600;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .app-loaded #loading-screen {
        opacity: 0;
        visibility: hidden;
      }
    </style>

    <!-- Performance Optimization -->
    <link rel="preconnect" href="https://apis.google.com">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com">
    <link rel="dns-prefetch" href="https://apis.google.com">
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://sdk.mercadopago.com/js/v2"></script>
  </head>
  <body class="bg-[#ffffff] text-gray-800 notranslate overflow-x-hidden">

    <div id="loading-screen">

        <img src="/estampas/logo-fpac.png" alt="F PAC STORE" class="loading-logo" onerror="this.style.display='none'">

    </div>

    <div id="root"></div>
