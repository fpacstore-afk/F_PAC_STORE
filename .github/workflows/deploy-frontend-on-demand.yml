name: Deploy Frontend Only

on:
  # The Cloud Run workflow already validates and publishes the matching frontend.
  # Keep this workflow for an explicit frontend-only recovery, avoiding duplicate
  # builds and races between two different production publications on each push.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-firebase-hosting
  cancel-in-progress: false

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      GCP_PROJECT_ID: fpac-store62
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Production dependency security audit
        run: npm run security:audit

      - name: Lint
        run: npm run lint
      - name: Full isolated regression suite
        run: npm run test:all
      - name: Build
        run: npm run build
      - name: Production preflight
        run: npm run preflight:production
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/1039063784001/locations/global/workloadIdentityPools/github-actions/providers/github-fpac-store
          service_account: github-fpac-cicd@fpac-store62.iam.gserviceaccount.com
      - name: Deploy frontend to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project "$GCP_PROJECT_ID" --non-interactive
      - name: Verify canonical public API and webhook routing
        run: node --import tsx scripts/verify_live_api_routing.ts
