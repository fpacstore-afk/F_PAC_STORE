name: Validate Pull Request

on:
  push:
    branches:
      - fix/catalog-products-certification
      - fix/inventory-2-certification
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply surgical Inventory 2.0 admin patch
        if: github.ref == 'refs/heads/fix/inventory-2-certification'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/admin/products/ProductManagementDrawer.tsx')
          text = p.read_text(encoding='utf-8')
          old_history = """  // Subscribe to movements history for this product
  useEffect(() => {
    if (!product?.id) {
      setMovements([]);
      return;
    }

    const q = query(
      collection(db, 'stock_movements'),
      where('productId', '==', product.id),
      orderBy('createdAt', 'desc'),
      limit(25)
    );

    const unsubscribe = onSnapshot(q, (snapshot) => {
      const list = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
      setMovements(list);
    }, (error) => {
      console.warn('Stock movements subscribe fallback:', error);
    });

    return () => unsubscribe();
  }, [product?.id]);
"""
          new_history = """  // Subscribe to movements history using the canonical Inventory 2.0 product identity.
  useEffect(() => {
    const movementProductSlug = product?.slug || product?.id;
    if (!movementProductSlug) {
      setMovements([]);
      return;
    }

    const q = query(
      collection(db, 'stock_movements'),
      where('productSlug', '==', movementProductSlug),
      orderBy('createdAt', 'desc'),
      limit(25)
    );

    const unsubscribe = onSnapshot(q, (snapshot) => {
      const list = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
      setMovements(list);
    }, (error) => {
      console.warn('Stock movements subscribe fallback:', error);
    });

    return () => unsubscribe();
  }, [product?.id, product?.slug]);
"""
          old_mutations = """      // 3. Register stock movements for any changed variants via official API
      for (const mov of changedMovements) {
        try {
          await recordStockMovementInDb(
            productSlug,
            mov.variantKey,
            'adjust',
            mov.newStock,
            mov.notes || 'Ajuste no cadastro do produto'
          );
        } catch (movErr) {
          console.error(`Error recording stock movement for ${productSlug} (${mov.variantKey}):`, movErr);
        }
      }
"""
          new_mutations = """      // 3. Inventory 2.0 is authoritative: stock mutation failures abort the success flow.
      for (const mov of changedMovements) {
        await recordStockMovementInDb(
          productSlug,
          mov.variantKey,
          'adjust',
          mov.newStock,
          mov.notes || 'Ajuste no cadastro do produto'
        );
      }
"""
          changed = False
          if old_history in text:
              text = text.replace(old_history, new_history, 1)
              changed = True
          if old_mutations in text:
              text = text.replace(old_mutations, new_mutations, 1)
              changed = True
          if changed:
              p.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet -- src/components/admin/products/ProductManagementDrawer.tsx; then
            echo "Admin stock patch already applied."
          else
            git config user.name "F Pac Store"
            git config user.email "fpacstore@gmail.com"
            git add src/components/admin/products/ProductManagementDrawer.tsx
            git commit -m "fix(inventory): align admin stock history and failures"
            git push origin HEAD:fix/inventory-2-certification
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: TypeScript
        run: npm run lint

      - name: PRIME sizing tests
        run: npm run test:prime-sizing

      - name: Catalog product tests
        run: npm run test:catalog-products

      - name: Inventory 2.0 tests
        run: npm run test:inventory-2

      - name: Build
        run: npm run build

      - name: Production preflight
        env:
          NODE_ENV: production
        run: npm run preflight:production