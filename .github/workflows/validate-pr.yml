name: Validate Pull Request

on:
  push:
    branches:
      - fix/catalog-products-certification
      - fix/inventory-2-certification
      - fix/orders-2-certification
      - fix/production-2-certification
      - fix/finance-2-certification
      - fix/shipping-2-certification
      - fix/checkout-payments-certification
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: TypeScript
        run: npm run lint

      - name: Full isolated regression suite
        run: npm run test:all

      - name: Setup Java for isolated Firestore rules
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore and Storage security rules (demo emulators only)
        run: npm run verify:security-rules

      - name: Build
        run: npm run build

      - name: Production preflight
        env:
          NODE_ENV: production
        run: npm run preflight:production
