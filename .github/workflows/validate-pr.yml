name: Validate Pull Request

on:
  push:
    branches:
      - fix/catalog-products-certification
      - fix/inventory-2-certification
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Repair Inventory 2.0 admin integration
        if: github.ref_name == 'fix/inventory-2-certification'
        run: |
          node scripts/repair_inventory_admin.cjs
          if ! git diff --quiet -- src/components/admin/products/ProductManagementDrawer.tsx; then
            git config user.name "F Pac Store"
            git config user.email "fpacstore@gmail.com"
            git add src/components/admin/products/ProductManagementDrawer.tsx
            git diff --cached --check
            git commit -m "fix(inventory): make admin stock mutations authoritative"
            git push origin HEAD:fix/inventory-2-certification
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: TypeScript
        run: npm run lint

      - name: PRIME sizing tests
        run: npm run test:prime-sizing

      - name: Catalog product tests
        run: npm run test:catalog-products

      - name: Inventory 2.0 tests
        run: npm run test:inventory-2

      - name: Build
        run: npm run build

      - name: Production preflight
        env:
          NODE_ENV: production
        run: npm run preflight:production
