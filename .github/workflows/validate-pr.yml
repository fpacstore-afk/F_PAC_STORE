name: Validate Pull Request

on:
  push:
    branches:
      - fix/catalog-products-certification
      - fix/inventory-2-certification
      - fix/orders-2-certification
      - fix/production-2-certification
      - fix/finance-2-certification
      - fix/shipping-2-certification
      - fix/checkout-payments-certification
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Production dependency security audit
        run: npm run security:audit

      - name: TypeScript
        run: npm run lint

      - name: Full isolated regression suite
        run: npm run test:all

      - name: Setup Java for isolated Firestore rules
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore and Storage security rules (demo emulators only)
        run: npm run verify:security-rules

      - name: Build
        run: npm run build

      - name: Production preflight
        env:
          NODE_ENV: production
        run: npm run preflight:production
