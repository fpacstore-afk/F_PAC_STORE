name: Apply Sheets Status Sync Fix

on:
  push:
    branches:
      - fix/sheets-status-sync
    paths:
      - scripts/apply_sheets_status_sync.py
      - .github/workflows/apply-sheets-status-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/sheets-status-sync
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: python scripts/apply_sheets_status_sync.py
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminFinancial.tsx
          git commit -m "fix(finance): sync sheets on canonical order status changes"
          git push origin HEAD:fix/sheets-status-sync
