name: Deploy Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reorganize_stock:
        description: Run the idempotent seven-family stock reorganization
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-cloud-run
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      GCP_PROJECT_ID: fpac-store62
      GCP_REGION: us-east1
      CLOUD_RUN_SERVICE: f-pac-store-n-o-s-roupa-identidade

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Production dependency security audit
        run: npm run security:audit

      - name: Lint
        run: npm run lint

      - name: Full isolated regression suite
        run: npm run test:all

      - name: Setup Java for isolated Firestore rules
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore security rules (demo emulator only)
        run: npm run verify:security-rules

      - name: Build
        run: npm run build

      - name: Production preflight
        run: npm run preflight:production

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/1039063784001/locations/global/workloadIdentityPools/github-actions/providers/github-fpac-store
          service_account: github-fpac-cicd@fpac-store62.iam.gserviceaccount.com

      - name: Setup Google Cloud
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      - name: Inspect provider authentication security configuration (read only)
        run: python3 scripts/inspect_auth_security.py

      - name: Deploy candidate without traffic
        id: candidate
        run: |
          export TAG="c-${GITHUB_RUN_NUMBER}"

          # --set-secrets removes every binding already present in the service.
          # Update bindings incrementally. If no JSON credential exists, the
          # runtime identity is used and the catalog check below verifies that
          # it really has access to the named Firestore database.
          SECRET_BINDINGS=()
          if gcloud secrets describe FIREBASE_SERVICE_ACCOUNT \
            --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            SECRET_BINDINGS+=("FIREBASE_SERVICE_ACCOUNT=FIREBASE_SERVICE_ACCOUNT:latest")
          else
            echo "FIREBASE_SERVICE_ACCOUNT ausente; será usada a identidade de execução do Cloud Run."
          fi
          if gcloud secrets describe MELHOR_ENVIO_TOKEN \
            --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            SECRET_BINDINGS+=("MELHOR_ENVIO_TOKEN=MELHOR_ENVIO_TOKEN:latest")
          else
            echo "Credencial opcional do Secret Manager ausente; será usada a configuração protegida feita no painel administrativo."
          fi
          SECRET_ARGS=()
          if [ "${#SECRET_BINDINGS[@]}" -gt 0 ]; then
            SECRET_ARGS=("--update-secrets=$(IFS=,; echo "${SECRET_BINDINGS[*]}")")
          fi

          # Keep the active revision name so post-promotion failures can restore service traffic.
          PREVIOUS_REVISION="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json | python3 -c 'import json,sys; d=json.load(sys.stdin); items=[x for x in d.get("status",{}).get("traffic",[]) if x.get("percent",0)>0 and not x.get("tag")]; print(max(items,key=lambda x:x.get("percent",0)).get("revisionName","") if items else "")' 2>/dev/null || true)"
          echo "previous_revision=$PREVIOUS_REVISION" >> "$GITHUB_OUTPUT"

          # A source deployment can finish its first cold rollout slightly
          # after gcloud's synchronous readiness deadline. Keep the candidate
          # isolated, then poll its actual Ready condition before declaring
          # the rollout failed.
          DEPLOY_STATUS=0
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source . \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --no-traffic \
            --concurrency=80 \
            --startup-probe=httpGet.path=/runtime-health,httpGet.port=3000,periodSeconds=5,timeoutSeconds=5,failureThreshold=20 \
            --liveness-probe=httpGet.path=/runtime-health,httpGet.port=3000,periodSeconds=30,timeoutSeconds=5,failureThreshold=3 \
            --tag "$TAG" \
            --update-env-vars="FIREBASE_PROJECT_ID=$GCP_PROJECT_ID,FIREBASE_DATABASE_ID=ai-studio-a7d50f8c-9b01-4490-9a13-dd8892e0c41a,MERCADO_PAGO_WEBHOOK_URL=https://fpac-store62.web.app/api/webhook/mercadopago" \
            "${SECRET_ARGS[@]}" \
            --quiet || DEPLOY_STATUS=$?

          REVISION="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.latestCreatedRevisionName)')"

          TAG_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json | python3 -c 'import json,sys,os; d=json.load(sys.stdin); tag=os.environ["TAG"]; print(next((x.get("url","") for x in d.get("status",{}).get("traffic",[]) if x.get("tag")==tag), ""))')"

          test -n "$REVISION"
          test -n "$TAG_URL"

          if [ "$DEPLOY_STATUS" -ne 0 ]; then
            echo "Aguardando a revisão candidata concluir após o prazo do gcloud: $REVISION"
            READY=""
            for attempt in $(seq 1 12); do
              READY="$(gcloud run revisions describe "$REVISION" \
                --project "$GCP_PROJECT_ID" \
                --region "$GCP_REGION" \
                --format='value(status.conditions[?type=Ready].status)')"
              if [ "$READY" = "True" ]; then
                break
              fi
              echo "Candidata ainda não está pronta (tentativa $attempt/12; Ready=$READY)."
              sleep 30
            done
            if [ "$READY" != "True" ]; then
              echo "A revisão candidata não ficou pronta após a janela adicional."
              exit "$DEPLOY_STATUS"
            fi
          fi

          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "url=$TAG_URL" >> "$GITHUB_OUTPUT"

      - name: Health check candidate
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "${{ steps.candidate.outputs.url }}/api/health"

      - name: HTTP liveness check candidate
        run: |
          curl --fail --silent --show-error \
            "${{ steps.candidate.outputs.url }}/runtime-health"

      - name: Apply owner-approved integer catalog prices
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[catalog-integer-20261108]')
        run: |
          IMAGE="$(gcloud run revisions describe "${{ steps.candidate.outputs.revision }}" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(spec.containers[0].image)')"
          RUNTIME_SA="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(spec.template.spec.serviceAccountName)')"
          test -n "$IMAGE"
          test -n "$RUNTIME_SA"
          # Match only the Firebase credential binding already used by this revision.
          # Values stay in Secret Manager; payment/admin integration keys are not copied.
          FIREBASE_JOB_SECRET="$(gcloud run revisions describe "${{ steps.candidate.outputs.revision }}" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json | python3 -c '
          import json,sys
          data=json.load(sys.stdin); spec=data.get("spec",{}); env=spec.get("containers",[{}])[0].get("env",[])
          entry=next((e for e in env if e.get("name")=="FIREBASE_SERVICE_ACCOUNT"),{}); ref=entry.get("valueFrom",{}).get("secretKeyRef",{})
          name=ref.get("name",""); aliases=dict(part.split(":",1) for part in data.get("metadata",{}).get("annotations",{}).get("run.googleapis.com/secrets","").split(",") if ":" in part)
          name=aliases.get(name,name)
          print("FIREBASE_SERVICE_ACCOUNT="+name+":"+ref.get("key","latest") if name else "")')"
          FIREBASE_JOB_ARGS=()
          if [ -n "$FIREBASE_JOB_SECRET" ]; then
            FIREBASE_JOB_ARGS=("--set-secrets=$FIREBASE_JOB_SECRET")
          fi
          CATALOG_JOB_STATUS=0
          gcloud run jobs deploy fpac-catalog-integer-20261108 \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$IMAGE" --service-account "$RUNTIME_SA" \
            --command /cnb/lifecycle/launcher --args node,build-server/apply-catalog-integer-prices.cjs \
            --set-env-vars="NODE_ENV=production,FIREBASE_PROJECT_ID=$GCP_PROJECT_ID,FIREBASE_DATABASE_ID=ai-studio-a7d50f8c-9b01-4490-9a13-dd8892e0c41a" \
            "${FIREBASE_JOB_ARGS[@]}" \
            --tasks=1 --max-retries=0 --task-timeout=180s \
            --cpu=1 --memory=3Gi --execute-now --wait --quiet || CATALOG_JOB_STATUS=$?
          if [ "$CATALOG_JOB_STATUS" -ne 0 ]; then
            LAST_CATALOG_EXECUTION="$(gcloud run jobs executions list \
              --job fpac-catalog-integer-20261108 --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --sort-by='~metadata.creationTimestamp' --limit=1 --format='value(metadata.name)' 2>/dev/null || true)"
            if [ -n "$LAST_CATALOG_EXECUTION" ]; then
              gcloud run jobs executions describe "$LAST_CATALOG_EXECUTION" \
                --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
                --format='json(status.conditions,status.failedCount,status.succeededCount)' || true
            fi
            # This task logs only fixed diagnostics, never product rows or credentials.
            gcloud logging read \
              'resource.type="cloud_run_job" AND resource.labels.job_name="fpac-catalog-integer-20261108"' \
              --project "$GCP_PROJECT_ID" --freshness=10m --limit=12 \
              --format='value(textPayload)' || true
            exit "$CATALOG_JOB_STATUS"
          fi

      - name: Firestore catalog check candidate
        run: |
          set +e
          for attempt in 1 2 3 4 5 6; do
            curl --fail-with-body --silent --show-error \
              "${{ steps.candidate.outputs.url }}/api/products" > candidate-catalog.json
            CATALOG_STATUS=$?
            if [ "$CATALOG_STATUS" -eq 0 ]; then
              set -e
              python3 -c 'import json; data=json.load(open("candidate-catalog.json")); assert isinstance(data.get("products"), list), "Catálogo inválido"'
              exit 0
            fi
            if python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); sys.exit(0 if data.get("error") == "CATALOG_QUOTA_EXHAUSTED" else 1)' candidate-catalog.json 2>/dev/null; then
              echo "A cota diária gratuita do Firestore está esgotada; a candidata saudável será promovida e o catálogo voltará quando a cota renovar."
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Catálogo indisponível (tentativa $attempt/6); nova tentativa em 5 segundos."
              sleep 5
            fi
          done
          echo "A revisão candidata não conseguiu consultar o Firestore."
          exit "$CATALOG_STATUS"

      - name: Reorganize approved stock range in the existing runtime
        if: (github.event_name == 'push' && contains(github.event.head_commit.message, '[stock-range-20261029]')) || inputs.reorganize_stock == true
        run: |
          IMAGE="$(gcloud run revisions describe "${{ steps.candidate.outputs.revision }}" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(spec.containers[0].image)')"
          RUNTIME_SA="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(spec.template.spec.serviceAccountName)')"
          test -n "$IMAGE"
          test -n "$RUNTIME_SA"
          # Match only the Firebase credential binding already used by this revision.
          # Values stay in Secret Manager; payment/admin integration keys are not copied.
          FIREBASE_JOB_SECRET="$(gcloud run revisions describe "${{ steps.candidate.outputs.revision }}" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json | python3 -c '
          import json,sys
          data=json.load(sys.stdin); spec=data.get("spec",{}); env=spec.get("containers",[{}])[0].get("env",[])
          entry=next((e for e in env if e.get("name")=="FIREBASE_SERVICE_ACCOUNT"),{}); ref=entry.get("valueFrom",{}).get("secretKeyRef",{})
          name=ref.get("name",""); aliases=dict(part.split(":",1) for part in data.get("metadata",{}).get("annotations",{}).get("run.googleapis.com/secrets","").split(",") if ":" in part)
          name=aliases.get(name,name)
          print("FIREBASE_SERVICE_ACCOUNT="+name+":"+ref.get("key","latest") if name else "")')"
          FIREBASE_JOB_ARGS=()
          if [ -n "$FIREBASE_JOB_SECRET" ]; then
            FIREBASE_JOB_ARGS=("--set-secrets=$FIREBASE_JOB_SECRET")
          fi
          STOCK_JOB_STATUS=0
          gcloud run jobs deploy fpac-stock-range-20261029 \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$IMAGE" --service-account "$RUNTIME_SA" \
            --command /cnb/lifecycle/launcher --args node,build-server/reorganize-stock-range.cjs \
            --set-env-vars="NODE_ENV=production,FIREBASE_PROJECT_ID=$GCP_PROJECT_ID,FIREBASE_DATABASE_ID=ai-studio-a7d50f8c-9b01-4490-9a13-dd8892e0c41a" \
            "${FIREBASE_JOB_ARGS[@]}" \
            --tasks=1 --max-retries=0 --task-timeout=180s \
            --cpu=1 --memory=3Gi --execute-now --wait --quiet || STOCK_JOB_STATUS=$?
          if [ "$STOCK_JOB_STATUS" -ne 0 ]; then
            LAST_STOCK_EXECUTION="$(gcloud run jobs executions list \
              --job fpac-stock-range-20261029 --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --sort-by='~metadata.creationTimestamp' --limit=1 --format='value(metadata.name)' 2>/dev/null || true)"
            if [ -n "$LAST_STOCK_EXECUTION" ]; then
              gcloud run jobs executions describe "$LAST_STOCK_EXECUTION" \
                --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
                --format='json(status.conditions,status.failedCount,status.succeededCount)' || true
            fi
            # This task logs only fixed diagnostics, never inventory rows or credentials.
            gcloud logging read \
              'resource.type="cloud_run_job" AND resource.labels.job_name="fpac-stock-range-20261029"' \
              --project "$GCP_PROJECT_ID" --freshness=10m --limit=12 \
              --format='value(textPayload)' || true
            exit "$STOCK_JOB_STATUS"
          fi

      - name: Verify candidate security boundaries
        env:
          PUBLIC_API_BASE_URL: ${{ steps.candidate.outputs.url }}
          REQUIRE_PRIVATE_FILE_404: 'true'
        run: node --import tsx scripts/verify_live_security.ts

      - name: Remove obsolete CI preview access
        run: python3 scripts/cleanup_preview_tags.py --keep-tag "c-${GITHUB_RUN_NUMBER}"

      - name: Promote validated revision
        # Security checks use read-only requests and never print artifact bodies.
        # The one-time stock job above remains conditional on its explicit marker.
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions="${{ steps.candidate.outputs.revision }}=100" \
            --quiet

      - name: Record runtime capacity and probe configuration
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json | python3 -c '
          import json,sys
          data=json.load(sys.stdin); template=data.get("spec",{}).get("template",{}); spec=template.get("spec",{}); annotations=template.get("metadata",{}).get("annotations",{})
          print(json.dumps({"scaling":{k:annotations.get(k) for k in ["autoscaling.knative.dev/minScale","autoscaling.knative.dev/maxScale"]},"concurrency":spec.get("containerConcurrency"),"timeoutSeconds":spec.get("timeoutSeconds"),"containers":[{k:c.get(k) for k in ["resources","startupProbe","livenessProbe"]} for c in spec.get("containers",[])]},indent=2))'

      - name: Deploy frontend to Firebase Hosting
        run: |
          npx firebase-tools deploy \
            --only hosting \
            --project "$GCP_PROJECT_ID" \
            --non-interactive

      - name: Verify canonical public API and webhook routing
        run: node --import tsx scripts/verify_live_api_routing.ts

      - name: Verify store domain API and webhook routing
        env:
          PUBLIC_API_BASE_URL: https://fpacstore.com.br
        run: node --import tsx scripts/verify_live_api_routing.ts

      - name: Verify canonical and store security boundaries
        run: |
          node --import tsx scripts/verify_live_security.ts
          PUBLIC_API_BASE_URL=https://fpacstore.com.br node --import tsx scripts/verify_live_security.ts

      # Deploy only after the storefront has switched to the public projection.
      - name: Deploy validated Firebase rules
        run: npx firebase-tools deploy --only firestore:rules,storage --project "$GCP_PROJECT_ID" --non-interactive

      - name: Configure and verify owner-authorized Auth security
        if: github.event_name == 'push' && (contains(github.event.head_commit.message, '[auth-hardening-20261108]') || contains(github.event.head_commit.message, '[recaptcha-audit-20261108]'))
        run: |
          IMAGE="$(gcloud run revisions describe "${{ steps.candidate.outputs.revision }}" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(spec.containers[0].image)')"
          RUNTIME_SA="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --format='value(spec.template.spec.serviceAccountName)')"
          test -n "$IMAGE"
          test -n "$RUNTIME_SA"
          # Match only the Firebase credential binding already used by this revision.
          # Values stay in Secret Manager; payment/admin integration keys are not copied.
          FIREBASE_JOB_SECRET="$(gcloud run revisions describe "${{ steps.candidate.outputs.revision }}" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json | python3 -c '
          import json,sys
          data=json.load(sys.stdin); spec=data.get("spec",{}); env=spec.get("containers",[{}])[0].get("env",[])
          entry=next((e for e in env if e.get("name")=="FIREBASE_SERVICE_ACCOUNT"),{}); ref=entry.get("valueFrom",{}).get("secretKeyRef",{})
          name=ref.get("name",""); aliases=dict(part.split(":",1) for part in data.get("metadata",{}).get("annotations",{}).get("run.googleapis.com/secrets","").split(",") if ":" in part)
          name=aliases.get(name,name)
          print("FIREBASE_SERVICE_ACCOUNT="+name+":"+ref.get("key","latest") if name else "")')"
          FIREBASE_JOB_ARGS=()
          if [ -n "$FIREBASE_JOB_SECRET" ]; then
            FIREBASE_JOB_ARGS=("--set-secrets=$FIREBASE_JOB_SECRET")
          fi
          if [ "${{ contains(github.event.head_commit.message, '[recaptcha-audit-20261108]') }}" = "true" ]; then
            gcloud services enable recaptchaenterprise.googleapis.com --project "$GCP_PROJECT_ID" --quiet
          fi
          AUTH_JOB_STATUS=0
          gcloud run jobs deploy fpac-auth-security-20261108 \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --image "$IMAGE" --service-account "$RUNTIME_SA" \
            --command /cnb/lifecycle/launcher --args node,build-server/configure-auth-security.cjs \
            --set-env-vars="AUTH_SECURITY_APPLY=${{ contains(github.event.head_commit.message, '[auth-hardening-20261108]') && 'owner-approved-20261108' || '' }},AUTH_RECAPTCHA_APPLY=${{ contains(github.event.head_commit.message, '[recaptcha-audit-20261108]') && 'owner-approved-audit-20261108' || '' }},NODE_ENV=production,FIREBASE_PROJECT_ID=$GCP_PROJECT_ID,FIREBASE_DATABASE_ID=ai-studio-a7d50f8c-9b01-4490-9a13-dd8892e0c41a" \
            "${FIREBASE_JOB_ARGS[@]}" \
            --tasks=1 --max-retries=0 --task-timeout=180s \
            --cpu=1 --memory=3Gi --execute-now --wait --quiet || AUTH_JOB_STATUS=$?
          if [ "$AUTH_JOB_STATUS" -ne 0 ]; then
            LAST_AUTH_EXECUTION="$(gcloud run jobs executions list \
              --job fpac-auth-security-20261108 --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --sort-by='~metadata.creationTimestamp' --limit=1 --format='value(metadata.name)' 2>/dev/null || true)"
            if [ -n "$LAST_AUTH_EXECUTION" ]; then
              gcloud run jobs executions describe "$LAST_AUTH_EXECUTION" \
                --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
                --format='json(status.conditions,status.failedCount,status.succeededCount)' || true
            fi
            # This task logs only fixed diagnostics, never account data or credentials.
            gcloud logging read \
              'resource.type="cloud_run_job" AND resource.labels.job_name="fpac-auth-security-20261108"' \
              --project "$GCP_PROJECT_ID" --freshness=10m --limit=12 \
              --format='value(textPayload)' || true
            exit "$AUTH_JOB_STATUS"
          fi

          # The job itself already verifies the read-back configuration and exits nonzero on failure.
          # Reading its sanitized logs is optional; the deploy identity may lack Logs Viewer.
          if ! gcloud logging read \
            'resource.type="cloud_run_job" AND resource.labels.job_name="fpac-auth-security-20261108" AND (textPayload:"AUTH_SECURITY_BEFORE" OR textPayload:"AUTH_SECURITY_AFTER")' \
            --project "$GCP_PROJECT_ID" --freshness=10m --limit=4 --order=asc \
            --format='value(textPayload)' 2>/dev/null; then
            echo "Auth security job completed and verified its configuration; sanitized logs are available to authorized viewers in Cloud Console."
          fi

      - name: Restore prior Cloud Run revision after a post-deploy failure
        if: failure() && steps.candidate.outputs.previous_revision != ''
        env:
          PREVIOUS_REVISION: ${{ steps.candidate.outputs.previous_revision }}
        run: |
          echo "Restoring Cloud Run traffic to $PREVIOUS_REVISION after a failed production verification."
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions="${PREVIOUS_REVISION}=100" \
            --quiet
