name: Deploy Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-cloud-run
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      GCP_PROJECT_ID: fpac-store62
      GCP_REGION: us-east1
      CLOUD_RUN_SERVICE: f-pac-store-n-o-s-roupa-identidade

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Full isolated regression suite
        run: npm run test:all

      - name: Setup Java for isolated Firestore rules
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore security rules (demo emulator only)
        run: npm run verify:security-rules

      - name: Build
        run: npm run build

      - name: Production preflight
        run: npm run preflight:production

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1039063784001/locations/global/workloadIdentityPools/github-actions/providers/github-fpac-store
          service_account: github-fpac-cicd@fpac-store62.iam.gserviceaccount.com

      - name: Setup Google Cloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy candidate without traffic
        id: candidate
        run: |
          export TAG="c-${GITHUB_RUN_NUMBER}"

          # --set-secrets removes every binding already present in the service.
          # Update bindings incrementally. If no JSON credential exists, the
          # runtime identity is used and the catalog check below verifies that
          # it really has access to the named Firestore database.
          SECRET_BINDINGS=()
          if gcloud secrets describe FIREBASE_SERVICE_ACCOUNT \
            --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            SECRET_BINDINGS+=("FIREBASE_SERVICE_ACCOUNT=FIREBASE_SERVICE_ACCOUNT:latest")
          else
            echo "FIREBASE_SERVICE_ACCOUNT ausente; será usada a identidade de execução do Cloud Run."
          fi
          if gcloud secrets describe MELHOR_ENVIO_TOKEN \
            --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            SECRET_BINDINGS+=("MELHOR_ENVIO_TOKEN=MELHOR_ENVIO_TOKEN:latest")
          else
            echo "Credencial opcional do Secret Manager ausente; será usada a configuração protegida feita no painel administrativo."
          fi
          SECRET_ARGS=()
          if [ "${#SECRET_BINDINGS[@]}" -gt 0 ]; then
            SECRET_ARGS=("--update-secrets=$(IFS=,; echo "${SECRET_BINDINGS[*]}")")
          fi

          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source . \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --no-traffic \
            --tag "$TAG" \
            --update-env-vars="FIREBASE_PROJECT_ID=$GCP_PROJECT_ID,FIREBASE_DATABASE_ID=ai-studio-a7d50f8c-9b01-4490-9a13-dd8892e0c41a" \
            "${SECRET_ARGS[@]}" \
            --quiet

          REVISION="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.latestCreatedRevisionName)')"

          TAG_URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json | python3 -c 'import json,sys,os; d=json.load(sys.stdin); tag=os.environ["TAG"]; print(next((x.get("url","") for x in d.get("status",{}).get("traffic",[]) if x.get("tag")==tag), ""))')"

          test -n "$REVISION"
          test -n "$TAG_URL"

          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "url=$TAG_URL" >> "$GITHUB_OUTPUT"

      - name: Health check candidate
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "${{ steps.candidate.outputs.url }}/api/health"

      - name: Firestore catalog check candidate
        run: |
          set +e
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            --retry-all-errors \
            "${{ steps.candidate.outputs.url }}/api/products" > candidate-catalog.json
          CATALOG_STATUS=$?
          if [ "$CATALOG_STATUS" -ne 0 ]; then
            echo "A revisão candidata não conseguiu consultar o Firestore."
            gcloud logging read \
              "resource.type=cloud_run_revision AND resource.labels.service_name=${CLOUD_RUN_SERVICE} AND severity>=ERROR" \
              --project "$GCP_PROJECT_ID" \
              --limit 20 \
              --format='value(textPayload)' || true
            exit "$CATALOG_STATUS"
          fi
          set -e
          python3 -c 'import json; data=json.load(open("candidate-catalog.json")); assert isinstance(data.get("products"), list), "Catálogo inválido"'

      - name: Promote validated revision
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions="${{ steps.candidate.outputs.revision }}=100" \
            --quiet

      - name: Deploy frontend to Firebase Hosting
        run: |
          npx firebase-tools deploy \
            --only hosting \
            --project "$GCP_PROJECT_ID" \
            --non-interactive

      # Deploy only after the storefront has switched to the public projection.
      - name: Deploy validated Firebase rules
        run: npx firebase-tools deploy --only firestore:rules,storage --project "$GCP_PROJECT_ID" --non-interactive
