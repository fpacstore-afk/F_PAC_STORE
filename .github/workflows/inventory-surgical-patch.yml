name: Inventory Surgical Patch

on:
  push:
    branches:
      - fix/inventory-2-certification

permissions:
  contents: write

jobs:
  patch-admin-stock-consistency:
    if: "${{ !startsWith(github.event.head_commit.message, 'fix(inventory): surgical admin stock consistency') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/inventory-2-certification
          fetch-depth: 0

      - name: Apply exact Inventory 2.0 admin corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/admin/products/ProductManagementDrawer.tsx')
          text = path.read_text(encoding='utf-8')

          old_history = """  // Subscribe to movements history for this product
  useEffect(() => {
    if (!product?.id) {
      setMovements([]);
      return;
    }

    const q = query(
      collection(db, 'stock_movements'),
      where('productId', '==', product.id),
      orderBy('createdAt', 'desc'),
      limit(25)
    );

    const unsubscribe = onSnapshot(q, (snapshot) => {
      const list = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
      setMovements(list);
    }, (error) => {
      console.warn('Stock movements subscribe fallback:', error);
    });

    return () => unsubscribe();
  }, [product?.id]);
"""
          new_history = """  // Subscribe to the official Stock 2.0 movement identity for this product.
  useEffect(() => {
    const movementProductSlug = product?.slug || product?.id;
    if (!movementProductSlug) {
      setMovements([]);
      return;
    }

    const q = query(
      collection(db, 'stock_movements'),
      where('productSlug', '==', movementProductSlug),
      orderBy('createdAt', 'desc'),
      limit(25)
    );

    const unsubscribe = onSnapshot(q, (snapshot) => {
      const list = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
      setMovements(list);
    }, (error) => {
      console.warn('Stock movements subscribe fallback:', error);
    });

    return () => unsubscribe();
  }, [product?.id, product?.slug]);
"""

          old_mutations = """      // 3. Register stock movements for any changed variants via official API
      for (const mov of changedMovements) {
        try {
          await recordStockMovementInDb(
            productSlug,
            mov.variantKey,
            'adjust',
            mov.newStock,
            mov.notes || 'Ajuste no cadastro do produto'
          );
        } catch (movErr) {
          console.error(`Error recording stock movement for ${productSlug} (${mov.variantKey}):`, movErr);
        }
      }

      toast.success('✓ Produto e estoque atualizados com sucesso!', { id: toastId });
"""
          new_mutations = """      // 3. Inventory 2.0 is authoritative: a stock mutation failure must abort success.
      for (const mov of changedMovements) {
        await recordStockMovementInDb(
          productSlug,
          mov.variantKey,
          'adjust',
          mov.newStock,
          mov.notes || 'Ajuste no cadastro do produto'
        );
      }

      toast.success('✓ Produto e estoque atualizados com sucesso!', { id: toastId });
"""

          if old_history not in text:
              raise SystemExit('Expected history block not found; refusing unsafe patch')
          if old_mutations not in text:
              raise SystemExit('Expected mutation block not found; refusing unsafe patch')

          text = text.replace(old_history, new_history, 1)
          text = text.replace(old_mutations, new_mutations, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit surgical correction
        shell: bash
        run: |
          if git diff --quiet -- src/components/admin/products/ProductManagementDrawer.tsx; then
            echo "No patch required."
            exit 0
          fi
          git config user.name "F Pac Store"
          git config user.email "fpacstore@gmail.com"
          git add src/components/admin/products/ProductManagementDrawer.tsx
          git commit -m "fix(inventory): surgical admin stock consistency"
          git push origin HEAD:fix/inventory-2-certification
