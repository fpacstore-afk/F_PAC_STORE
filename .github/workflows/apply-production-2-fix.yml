name: Apply Production 2.0 Fix

on:
  push:
    branches:
      - fix/production-2-certification
    paths:
      - scripts/apply_production_2_concurrency_fix.py
      - .github/workflows/apply-production-2-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-2-certification
          fetch-depth: 0

      - name: Apply transactional production transition fix
        run: python3 scripts/apply_production_2_concurrency_fix.py

      - name: Commit fix when needed
        shell: bash
        run: |
          if git diff --quiet -- server/controllers/admin.controller.ts; then
            echo "Production controller already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/controllers/admin.controller.ts
          git commit -m "fix(production): make stage transitions transactional"
          git push origin HEAD:fix/production-2-certification
