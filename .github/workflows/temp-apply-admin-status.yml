name: Temp Apply Admin Status Standardization

on:
  push:
    branches:
      - fix/admin-status-standardization
    paths:
      - scripts/patch_admin_status_standardization.py
      - .github/workflows/temp-apply-admin-status.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/admin-status-standardization
          fetch-depth: 0
      - name: Apply admin status standardization
        run: python3 scripts/patch_admin_status_standardization.py
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- src/pages/AdminOrders.tsx; then
            echo 'AdminOrders already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/AdminOrders.tsx
          git commit -m 'fix(admin): separar status de pagamento produção e envio'
          git push origin HEAD:fix/admin-status-standardization
