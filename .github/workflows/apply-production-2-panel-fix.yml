name: Apply Production 2.0 Panel Fix

on:
  push:
    branches:
      - fix/production-2-certification
    paths:
      - scripts/apply_production_2_panel_fix.py
      - .github/workflows/apply-production-2-panel-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-panel-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-2-certification
          fetch-depth: 0

      - name: Apply Production 2.0 panel integration fixes
        run: python3 scripts/apply_production_2_panel_fix.py

      - name: Commit panel fixes when needed
        shell: bash
        run: |
          if git diff --quiet -- src/components/OrderProductionDrawer.tsx src/pages/AdminOrders.tsx; then
            echo "Production panel already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/OrderProductionDrawer.tsx src/pages/AdminOrders.tsx
          git commit -m "fix(production): route admin panel stages through production state"
          git push origin HEAD:fix/production-2-certification
