name: Apply Financial Product Status Canonicalization

on:
  push:
    branches:
      - fix/financial-product-status-canonical
    paths:
      - scripts/patch_financial_product_status_canonical.py
      - .github/workflows/apply-financial-product-status-canonical.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/financial-product-status-canonical
          fetch-depth: 0

      - name: Apply canonical financial status patch
        run: python3 scripts/patch_financial_product_status_canonical.py

      - name: Commit patch when needed
        shell: bash
        run: |
          if git diff --quiet -- src/components/AdminFinancial.tsx; then
            echo "Financial status patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AdminFinancial.tsx
          git commit -m "fix(finance): canonicalize product and break-even payment status"
          git push origin HEAD:fix/financial-product-status-canonical
