name: Apply Catalog Integration

on:
  push:
    branches:
      - fix/catalog-products-certification
    paths:
      - '.github/workflows/apply-catalog-integration.yml'
      - 'scripts/apply_catalog_page_integration.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/catalog-products-certification
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply integration
        run: python scripts/apply_catalog_page_integration.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Validate TypeScript
        run: npm run lint

      - name: Validate catalog tests
        run: npm run test:catalog-products

      - name: Validate PRIME regression tests
        run: npm run test:prime-sizing

      - name: Build
        run: npm run build

      - name: Production preflight
        env:
          NODE_ENV: production
        run: npm run preflight:production

      - name: Commit integrated pages
        run: |
          if git diff --quiet -- src/pages/Catalog.tsx src/pages/ProductDetail.tsx; then
            echo 'No integration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Catalog.tsx src/pages/ProductDetail.tsx
          git commit -m 'fix: integrate catalog authority into storefront pages'
          git push origin HEAD:fix/catalog-products-certification
